[package]
name = "vali-studio"
version = "0.1.0"
description = "Vali Studio — desktop companion for the Vali GeoGuessr map generator"
authors = ["Håkon Lia"]
edition = "2021"

[lib]
name = "vali_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "io-util",
  "process",
  "sync",
  "time",
  "macros",
] }
